<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glossary | 4MLSim</title>
  <meta name="theme-color" content="#1B2340">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/svg+xml" href="../assets/img/icon.svg">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/vendor/temml.css">
  <link rel="stylesheet" href="../assets/css/4mlsim.css">
  <script src="../assets/vendor/temml.min.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/stats.js"></script>
  <script src="../assets/js/plot.js"></script>
  <script src="../assets/js/modules.js"></script>
</head>
<body>
<div class="page">
  <header id="mlsHeader" data-variant="compact"></header>
  <div class="mod-top" id="mlsTop"><div id="mlsModBar"></div><div id="mlsTabs"></div></div>

  <div class="intro-box" id="mlsIntro">
    <h3>What this tool does</h3>
    <div class="intro-cols">
      <div>
        <p>Short, plain definitions of the terms used across 4MLSim, each with a link to the module where you can see it in action.</p>
      </div>
      <div>
        <p><b>How to use it</b></p>
        <ul>
          <li>Type in the search box: it looks in the terms and the definitions.</li>
          <li>Or click a letter.</li>
        </ul>
      </div>
    </div>
  </div>

  <section data-panel="sim">
    <div class="card">
      <input type="search" id="q" placeholder="Search, e.g. overfitting, recall, kernel" aria-label="Search the glossary" style="width:100%;box-sizing:border-box;font-size:16px">
      <div id="letters" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:10px"></div>
      <p class="note" id="count"></p>
      <dl id="list" style="margin:0"></dl>
    </div>
  </section>

  <footer id="mlsFooter"></footer>
</div>

<script>
(function () {
  'use strict';
  const MLS = window.MLS;
  const META = MLS.moduleMeta('glossary');
  const $ = id => document.getElementById(id);

  const G = [["Accuracy", "The share of correct predictions: (TP + TN) / all. Misleading when one class is rare.", "confusion-matrix"], ["Activation function", "The function a neuron applies to its weighted sum, such as ReLU, tanh or the sigmoid. It lets a network bend its boundary.", "ann"], ["Adam", "A gradient descent method that adapts the step size of every weight using running averages of the gradients.", "lstm"], ["Attention", "In a transformer, the weights with which each token looks at the earlier tokens: a softmax of query-key similarities.", "llm-intuition"], ["AUC", "Area under the ROC curve: the chance that a random positive gets a higher score than a random negative. 0.5 is guessing, 1 is perfect.", "roc-pr-calibration"], ["Autoregression (AR)", "A forecast of a series from its own past values with a linear regression. The usual benchmark for time series.", "lstm"], ["Backpropagation", "The chain rule applied from the output of a network back to its first layer, giving the gradient of the loss for every weight.", "ann"], ["Bagging", "Fitting many models on bootstrap samples and averaging them, as in a random forest.", "random-forest"], ["Benchmark", "A simple model (no change, AR, the average, the logit) that a new model must beat on the same test data.", "lstm"], ["Bias (of a model)", "Error from wrong assumptions: a too-simple model misses the pattern (underfitting).", "bias-variance"], ["Bias (of a neuron)", "The constant added to a neuron's weighted sum before the activation.", "ann"], ["BIC", "Bayesian information criterion: \u22122 log-likelihood + (parameters) \u00d7 log n. Lower is better; used to choose the number of components.", "gmm-em"], ["Bonferroni correction", "Multiply a p-value by the number of tests. Simple but very strict for related tests.", "data-snooping"], ["Boosting", "Adding small models one at a time, each fitted to the errors left by the previous ones.", "gradient-boosting"], ["Bootstrap", "Resampling the data with replacement to see how much a statistic varies.", "random-forest"], ["Brier score", "The average squared difference between predicted probabilities and the actual 0/1 outcomes. Lower is better.", "roc-pr-calibration"], ["Calibration", "Whether predicted probabilities match observed frequencies: of all cases given 30%, about 30% should happen.", "roc-pr-calibration"], ["Centroid", "The mean of the observations in a cluster; the center in k-means.", "k-means"], ["Classification", "Predicting a class (failed or healthy bank, recession or not).", "logistic-regression"], ["Clustering", "Finding groups of similar observations without labels.", "k-means"], ["Confusion matrix", "A table of actual classes (rows) against predicted classes (columns): TP, FN, FP, TN.", "confusion-matrix"], ["Core point", "In DBSCAN, a point with at least minPts points within distance \u03b5.", "dbscan"], ["Cost function (loss)", "The quantity a model minimizes during training, such as squared error or log loss.", "gradient-descent"], ["Cross-validation", "Splitting the training set into folds (here 4), fitting on all but one and validating on the one left out, in turn. Used to choose settings.", "cross-validation"], ["Curse of dimensionality", "With many inputs all distances become similar and data become sparse, which hurts distance-based methods.", "curse-of-dimensionality"], ["Data leakage", "Information from the test set, or from the future, slipping into training. It makes results look better than they are.", "data-leakage"], ["Data snooping", "Searching many models on the same data and reporting the best as if it were the only one tried.", "data-snooping"], ["DBSCAN", "Density-based clustering: clusters are dense regions; isolated points are noise.", "dbscan"], ["Decision tree", "A model that splits the data with yes/no questions on one input at a time.", "decision-tree"], ["Dendrogram", "The tree drawing of hierarchical clustering: merges at the height of their distance.", "hierarchical"], ["Dimension reduction", "Summarizing many inputs with a few new variables, as PCA does.", "pca"], ["Discount factor \u03b3", "In reinforcement learning, how much a reward one step later is worth today.", "q-learning"], ["Early stopping", "Stopping training when the validation error starts to rise.", "ann"], ["Eigenvalue, eigenvector", "For PCA: the variance along a principal component (eigenvalue) and its direction (eigenvector) of the covariance matrix.", "pca"], ["Elbow method", "Choosing k where the within-cluster sum of squares stops falling quickly.", "k-means"], ["EM algorithm", "Expectation-maximization: alternate probabilities of the hidden groups (E-step) and parameter updates (M-step).", "gmm-em"], ["Embedding", "A vector of numbers that represents a word or token; similar words get similar vectors.", "llm-intuition"], ["Ensemble", "A model that combines many models, such as a forest or a boosted sum of trees.", "random-forest"], ["Entropy", "A measure of uncertainty or impurity; used for tree splits and for next-word uncertainty.", "decision-tree"], ["Epoch", "One pass of training over the whole training set.", "ann"], ["Exploration", "In reinforcement learning, trying actions that do not look best, to discover better ones.", "q-learning"], ["F1 score", "The harmonic mean of precision and recall.", "confusion-matrix"], ["False negative (FN), type II error", "A positive case predicted as negative: a missed failure.", "confusion-matrix"], ["False positive (FP), type I error", "A negative case predicted as positive: a false alarm.", "confusion-matrix"], ["Feature (input)", "A variable used to make the prediction.", "feature-scaling"], ["Feature importance", "How much a model relies on each input, for example by permutation.", "explainability"], ["Feature scaling", "Putting inputs on comparable scales, usually by standardizing.", "feature-scaling"], ["Forget gate", "In an LSTM, the gate that decides how much of the old memory to keep.", "lstm"], ["Gaussian mixture", "A model of the data as a weighted sum of bell-shaped components.", "gmm-em"], ["Gini impurity", "The chance of misclassifying a random observation of a node by a random label from it; used to choose tree splits.", "decision-tree"], ["Gradient", "The direction and rate of fastest increase of the loss; training moves against it.", "gradient-descent"], ["Gradient descent", "Repeatedly moving the parameters a small step against the gradient of the loss.", "gradient-descent"], ["Grid search", "Trying every combination of a few values of each hyperparameter.", "hyperparameter-tuning"], ["Hidden layer", "A layer of neurons between the inputs and the output of a network.", "ann"], ["Hierarchical clustering", "Merging the closest clusters step by step into a tree.", "hierarchical"], ["Hold-out (test) set", "The data kept aside and used once, at the end, to judge the final model.", "cross-validation"], ["Hyperparameter", "A setting chosen before fitting (k, depth, C, learning rate), not learned from the data.", "hyperparameter-tuning"], ["ICE curves", "Individual conditional expectation: how one observation's prediction changes as one input changes.", "explainability"], ["K-means", "Clustering by repeating: assign to the nearest center, move centers to the means.", "k-means"], ["K-nearest neighbours", "Predicting from the k most similar training observations.", "knn"], ["Kernel trick", "Computing similarities in a higher-dimensional space without building it, so a linear separator there is curved in the data.", "svm-kernel"], ["Lasso", "Regression with a penalty on the absolute coefficients; sets some to exactly zero.", "regularization"], ["Learning rate", "The size of each gradient descent step (or of each boosting step).", "gradient-descent"], ["Linkage", "How the distance between two clusters is measured: single, complete, average, Ward.", "hierarchical"], ["Log loss (cross-entropy)", "The average of \u2212log(probability given to the actual class). 0.693 for two classes is guessing.", "logistic-regression"], ["Logistic regression", "A model for the probability of a class: the sigmoid of a weighted sum of the inputs.", "logistic-regression"], ["LSTM", "Long short-term memory: a recurrent network with forget, input and output gates.", "lstm"], ["MAE", "Mean absolute error of the forecasts.", "linear-regression"], ["Margin", "In an SVM, the width of the street between the classes.", "svm-linear"], ["Model Confidence Set", "The set of models that cannot be told apart from the best at a chosen level.", "data-snooping"], ["Naive Bayes", "Classification with Bayes' rule, assuming the inputs are independent within each class.", "naive-bayes"], ["Neural network", "Layers of neurons, each a weighted sum and an activation, trained by backpropagation.", "ann"], ["Noise point", "In DBSCAN, a point in no dense region: an outlier.", "dbscan"], ["Out-of-bag error", "In a random forest, the error on the observations each tree did not see in its bootstrap sample.", "random-forest"], ["Out-of-sample", "Data not used to fit or choose the model.", "data-snooping"], ["Overfitting", "Fitting the noise of the training set: excellent training score, poor test score.", "polynomial-overfitting"], ["Partial dependence", "The average prediction as one input is set to each value for every observation.", "explainability"], ["PCA", "Principal component analysis: new uncorrelated variables in the directions of largest variance.", "pca"], ["Permutation importance", "How much the test error grows when one input is shuffled.", "explainability"], ["Policy", "In reinforcement learning, the rule that says which action to take in each state.", "q-learning"], ["Precision", "Of the cases predicted positive, the share that are positive: TP / (TP + FP).", "confusion-matrix"], ["Q-learning", "Learning the value of each action in each state from rewards, by moving Q towards r + \u03b3 max Q.", "q-learning"], ["Random forest", "Many trees on bootstrap samples with random inputs at each split; they vote or average.", "random-forest"], ["Random search", "Trying randomly drawn combinations of hyperparameters.", "hyperparameter-tuning"], ["Reality Check", "White's bootstrap test of whether the best of many models truly beats a benchmark.", "data-snooping"], ["Recall (sensitivity)", "Of the positive cases, the share found: TP / (TP + FN).", "confusion-matrix"], ["Regression", "Predicting a number (a price, a growth rate).", "linear-regression"], ["Regularization", "A penalty on model complexity that reduces overfitting (ridge, lasso, \u03bb in XGBoost).", "regularization"], ["Reinforcement learning", "Learning to act from rewards and penalties rather than from correct answers.", "q-learning"], ["Responsibility", "In a Gaussian mixture, the probability that a component produced an observation.", "gmm-em"], ["Ridge regression", "Regression with a penalty on the squared coefficients; shrinks them towards zero.", "regularization"], ["RMSE", "Root mean squared error: the typical size of the forecast errors, in the units of the target.", "linear-regression"], ["ROC curve", "Sensitivity against the false alarm rate for every threshold.", "roc-pr-calibration"], ["Scree plot", "The share of variance of each principal component, in order.", "pca"], ["SHAP values", "Contributions of each input to one prediction that add up to the prediction minus the average (Shapley values).", "explainability"], ["Sigmoid", "The S-curve 1 / (1 + e^\u2212z), from 0 to 1.", "logistic-regression"], ["Silhouette", "For an observation, (b \u2212 a) / max(a, b): near 1 well inside its cluster, near 0 on a border.", "k-means"], ["Softmax", "Turns a list of scores into probabilities that sum to 1.", "llm-intuition"], ["SPA test", "Hansen's test for superior predictive ability: a more powerful version of the Reality Check.", "data-snooping"], ["Specificity", "Of the negative cases, the share predicted negative: TN / (TN + FP).", "confusion-matrix"], ["Standardize", "Subtract the mean and divide by the standard deviation (computed on the training set).", "feature-scaling"], ["Support vector", "A training observation on or inside the margin of an SVM; only these define the separator.", "svm-linear"], ["Support vector machine (SVM)", "A classifier that finds the separator with the widest margin, with a price C for errors.", "svm-linear"], ["Temperature", "In text generation, reshapes next-token probabilities: low is safe, high is varied.", "llm-intuition"], ["Test set", "See hold-out set: used once, at the end.", "cross-validation"], ["Threshold", "The probability above which a case is predicted positive (0.5 by default).", "confusion-matrix"], ["Time-series validation", "Validation that respects time order: train on the past, validate on the following period.", "ts-validation"], ["Token", "The unit a language model reads and writes: a word or a piece of a word.", "llm-intuition"], ["Training set", "The data used to fit the model (here 80%), including the cross-validation folds.", "cross-validation"], ["True positive (TP), true negative (TN)", "Correct predictions of a positive and of a negative case.", "confusion-matrix"], ["Underfitting", "A model too simple for the pattern: poor on both training and test data.", "bias-variance"], ["Unsupervised learning", "Learning from data without labels: clustering, dimension reduction.", "k-means"], ["Validation fold", "The part of the training set left out in one round of cross-validation.", "cross-validation"], ["Value iteration", "Solving the Bellman equation exactly when the rules of the world are known.", "q-learning"], ["Vanishing gradients", "Gradients that shrink layer by layer going back through a deep network or through time.", "ann"], ["Variance (of a model)", "How much a model changes with a different training sample; high variance means overfitting.", "bias-variance"], ["Ward linkage", "Merging the two clusters whose union increases the within-cluster sum of squares the least.", "hierarchical"], ["WCSS", "Within-cluster sum of squares: what k-means minimizes.", "k-means"], ["Weight", "A number multiplying an input in a neuron or a regression; learned in training.", "ann"], ["XGBoost", "Extreme gradient boosting: boosting with second-order statistics and regularization.", "xgboost"]];
  const S = { q: '', letter: '' };
  const STATE = { get: () => ({ q: S.q, letter: S.letter }), set: o => { if (typeof o.q === 'string') S.q = o.q.slice(0, 60); if (typeof o.letter === 'string') S.letter = o.letter.slice(0, 1); } };
  const name = id => { const m = MLS.moduleMeta(id); return m ? m.title : id; };
  function render() {
    $('q').value = S.q;
    const L = [...new Set(G.map(g => g[0][0].toUpperCase()))];
    $('letters').innerHTML = '<button type="button" class="btn-ghost btn-small" data-l=""' + (S.letter ? '' : ' aria-pressed="true"') + '>All</button>' + L.map(l => '<button type="button" class="btn-ghost btn-small" data-l="' + l + '"' + (S.letter === l ? ' aria-pressed="true"' : '') + '>' + l + '</button>').join('');
    MLS.$$('[data-l]').forEach(b => (b.onclick = () => { S.letter = b.dataset.l; S.q = ''; render(); }));
    const q = S.q.trim().toLowerCase(), list = G.filter(g => (q ? (g[0] + ' ' + g[1]).toLowerCase().includes(q) : !S.letter || g[0][0].toUpperCase() === S.letter));
    $('count').textContent = list.length + ' of ' + G.length + ' terms';
    $('list').innerHTML = list.map(g => '<dt style="font-weight:800;margin-top:14px;font-size:15.5px">' + MLS.esc(g[0]) + '</dt><dd style="margin:3px 0 0 0;line-height:1.55">' + MLS.esc(g[1]) + ' <a ' + MLS.navAttrs('modules/' + g[2] + '.html') + '>' + MLS.esc(name(g[2])) + '&nbsp;&rarr;</a></dd>').join('') || '<p class="note">No term found.</p>';
    MLS.state.save();
  }
  $('q').addEventListener('input', e => { S.q = e.target.value; S.letter = ''; render(); });
  MLS.moduleBar({ id: META.id, title: META.title, section: META.sectionTitle, level: META.level }, { tabs: [{ id: 'sim', label: 'Glossary' }] });
  MLS.state.init({ id: META.id, get: STATE.get, set: STATE.set });
  window.__mls = { S };
  document.addEventListener('mls:theme', () => render());
  render();
})();
</script>
</body>
</html>
